version: '3.9'
services:
  mimosa-backend:
    build:
      context: .
      dockerfile: "./backend/Dockerfile"
    env_file: .env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - DOMAIN=${DOMAIN}
      - BACKEND_PORT=${BACKEND_PORT}

  mimosa-frontend:
    build:
      context: .
      dockerfile: "./frontend/Dockerfile"
      args:
        DOMAIN: ${DOMAIN}
        BACKEND_PORT: ${BACKEND_PORT}
        BONSAI_PORT: ${BONSAI_PORT}
    env_file: .env
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - DOMAIN=${DOMAIN}
      - BACKEND_PORT=${BACKEND_PORT}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - BONSAI_PORT=${BONSAI_PORT}

  mongo:
    image: mongo:latest
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27018:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: >
        echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'${DOMAIN}:27018'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      - "./volumes/mongodb:/data/db"

  reportree:
    image: insapathogenomics/reportree:v2.5.4
    restart: always
